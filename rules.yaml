# GhostCheck scoring rules.
#
# Every signal is true, false or unknown for a given job. Only signals that
# are TRUE add their weight to the score: positive signals add, negative
# signals subtract. Unknown never counts, so a failed request can never make
# a job look worse.
#
# Edit this file and open a pull request to change how GhostCheck scores jobs.
# After editing, run `node scripts/sync.mjs` and `node --test`.
#
# Each reason has an English (en) and a Chinese (zh) version; the card shows
# the user's language. Reason text placeholders (filled in when available):
#   {company} {ats} {days} {atsDays} {ageSource} {team} {phrase} {salary} {matchedTitle}

version: 1

# Score thresholds. Anything between red.max_score and green.min_score is yellow.
badges:
  green:
    min_score: 3
  red:
    max_score: -3

# The badge is ⚪ "Can't verify" unless at least one of these signals is known
# (true or false). Description-only signals are too weak to judge a job alone.
require_any_known:
  - found_on_official_site
  - not_found_on_official_site
  - apply_link_closed

# How many reasons the card shows (3-5 recommended).
max_reasons: 5

# Title matching thresholds (0-1). See core/matcher.js.
matching:
  title_match: 0.8     # at or above: same job (if level and location agree)
  title_similar: 0.6   # at or above: "a similar job is listed" (neutral, never negative)

# Description matching with a small embedding model that runs on your
# computer (downloaded once, ~23 MB). It can only IMPROVE a title match:
# confirm a job whose title was reworded, or choose between near-identical
# titles. It never makes a job look worse. See core/semantic.js.
semantic:
  enabled: true
  min_chars: 300                 # role-specific text needed on both sides (a CJK character counts ~3)
  min_margin: 0.05               # best match must be this far ahead of the runner-up
  tie_title_gap: 0.05            # titles this close are a tie the descriptions may break
  # Cosine similarity needed to accept a reworded title, per model (users
  # choose the model on the options page). Measured with
  # scripts/eval-semantic.mjs on live boards: the threshold sits above the
  # best-scoring WRONG posting, so a different job is never confirmed.
  models:
    english:
      # 224 postings, 9 boards: 0.88 confirmed 72% of reworded titles with
      # no wrong match (closest wrong posting: 0.871); 0.85 confirmed 81%
      # but matched a wrong job in 1.3% of cases.
      promote_min_similarity: 0.88
    multilingual:
      promote_min_similarity: 0.9

# Age thresholds in days. The age is the oldest of: the careers site's own
# publish date, GhostCheck's daily snapshots, and the Wayback Machine.
age:
  recent_days: 30
  old_days: 90

signals:
  # ---------------------------------------------------------------- positive
  - id: found_on_official_site
    type: positive
    weight: 3
    reason:
      en: "This job is listed on {company}'s own careers site."
      zh: "该职位在{company}的官网招聘页上能找到。"

  - id: posted_recently
    type: positive
    weight: 1
    reason:
      en: "It was first published {days} days ago, according to {ageSource}."
      zh: "首次发布于 {days} 天前（来源：{ageSource}）。"

  - id: salary_listed
    type: positive
    weight: 1
    reason:
      en: "The posting states a pay range ({salary})."
      zh: "职位写明了薪资范围（{salary}）。"

  - id: specific_team
    type: positive
    weight: 1
    reason:
      en: "The description names a specific team or project ({team})."
      zh: "职位描述提到了具体的团队或项目（{team}）。"

  # ---------------------------------------------------------------- negative
  # Only counted when the full list of open jobs was fetched successfully
  # from a board that is known to belong to this company.
  - id: not_found_on_official_site
    type: negative
    weight: 3
    reason:
      en: "We could not find this job among {company}'s open jobs on {ats}."
      zh: "在{company}于 {ats} 上的在招职位中找不到这个职位。"

  - id: apply_link_closed
    type: negative
    weight: 3
    reason:
      en: "The apply link points to a job that is no longer listed on {company}'s careers site."
      zh: "申请链接指向的职位已不在{company}的官网招聘页上。"

  - id: posted_long_ago
    type: negative
    weight: 2
    reason:
      en: "It has been listed for at least {days} days, according to {ageSource}."
      zh: "已挂出至少 {days} 天（来源：{ageSource}）。"

  - id: generic_template
    type: negative
    weight: 1
    reason:
      en: "The description reads like a generic or pipeline posting (\"{phrase}\")."
      zh: "职位描述像是通用模板或人才储备岗位（「{phrase}」）。"

  # The careers site shows a publish date more than recent_days newer than the
  # oldest evidence (snapshots / Wayback): the posting was re-published so it
  # looks fresh. Overlaps with posted_long_ago, hence the low weight.
  - id: reposted_to_look_new
    type: negative
    weight: 1
    reason:
      en: "The careers site dates it {atsDays} days ago, but it existed long before, so it was probably re-posted to look new."
      zh: "官网显示的发布日期是 {atsDays} 天前，但这个职位早已存在，可能是为了显得新而重新发布。"
