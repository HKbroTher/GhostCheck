<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="options.title">GhostCheck options</title>
  <link rel="stylesheet" href="../permission/permission.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1 data-i18n="options.title">GhostCheck options</h1>

    <section>
      <h2><label for="language" data-i18n="options.language">Language</label></h2>
      <select id="language">
        <option value="auto" data-i18n="options.languageAuto">Same as browser</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
    </section>

    <section>
      <h2 data-i18n="options.cardTitle"></h2>
      <label class="toggle">
        <input type="checkbox" id="auto-open">
        <span data-i18n="options.autoOpenToggle"></span>
      </label>
      <p class="hint" data-i18n="options.autoOpenHint"></p>
    </section>

    <section>
      <h2 data-i18n="options.descTitle">Description matching</h2>
      <label class="toggle">
        <input type="checkbox" id="semantic">
        <span data-i18n="options.descToggle"></span>
      </label>
      <p class="hint" data-i18n="options.descHint"></p>
      <fieldset id="models">
        <label class="toggle"><input type="radio" name="model" value="english"> <span data-i18n="options.modelEnglish"></span></label>
        <label class="toggle"><input type="radio" name="model" value="multilingual"> <span data-i18n="options.modelMultilingual"></span></label>
      </fieldset>
      <p id="model-status"></p>
      <button type="button" id="delete-model" class="secondary" data-i18n="options.deleteModels"></button>
    </section>

    <section>
      <h2 data-i18n="options.autoTitle"></h2>
      <label class="toggle">
        <input type="checkbox" id="all-sites">
        <span data-i18n="options.autoToggle"></span>
      </label>
      <p class="hint" data-i18n="options.autoHint"></p>
    </section>

    <section>
      <h2 data-i18n="options.sitesTitle"></h2>
      <p class="hint" data-i18n="options.sitesHint"></p>
      <ul id="origins"></ul>
    </section>

    <p id="status" role="status"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
